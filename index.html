<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>在线计算器</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Calculator View -->
        <div id="calc-view" class="view active">
            <div class="calc-inner">
                <div class="calc-solar">
                    <div class="solar-cell"></div>
                    <div class="solar-cell"></div>
                    <div class="solar-cell"></div>
                    <div class="solar-cell"></div>
                </div>
                <div class="calc-brand">CASIO</div>
                <div class="calc-display">
                    <div class="calc-expr" id="calcExpr">&nbsp;</div>
                    <div class="calc-result" id="calcResult">0</div>
                </div>
                <div class="calc-buttons">
                    <button class="btn func" data-action="clear">AC</button>
                    <button class="btn func" data-action="sign">±</button>
                    <button class="btn func" data-action="percent">%</button>
                    <button class="btn op" data-action="op" data-op="÷">÷</button>
                    <button class="btn num" data-action="num" data-val="7">7</button>
                    <button class="btn num" data-action="num" data-val="8">8</button>
                    <button class="btn num" data-action="num" data-val="9">9</button>
                    <button class="btn op" data-action="op" data-op="×">×</button>
                    <button class="btn num" data-action="num" data-val="4">4</button>
                    <button class="btn num" data-action="num" data-val="5">5</button>
                    <button class="btn num" data-action="num" data-val="6">6</button>
                    <button class="btn op" data-action="op" data-op="−">−</button>
                    <button class="btn num" data-action="num" data-val="1">1</button>
                    <button class="btn num" data-action="num" data-val="2">2</button>
                    <button class="btn num" data-action="num" data-val="3">3</button>
                    <button class="btn op" data-action="op" data-op="+">+</button>
                    <button class="btn num zero" data-action="num" data-val="0">0</button>
                    <button class="btn num" data-action="dot">.</button>
                    <button class="btn eq" data-action="equals">=</button>
                </div>
            </div>
        </div>

        <!-- Login Overlay -->
        <div id="login-overlay" class="overlay">
            <div class="login-card">
                <div class="login-logo">💬</div>
                <h2 class="login-title">登录</h2>
                <div class="form-group">
                    <input type="text" id="loginId" placeholder="账号" autocomplete="off">
                </div>
                <div class="form-group">
                    <input type="password" id="loginPwd" placeholder="密码">
                </div>
                <button id="loginBtn" class="btn-primary">登录</button>
                <p id="loginError" class="form-error"></p>
            </div>
        </div>

        <!-- App View -->
        <div id="app-view" class="view">
            <!-- Header -->
            <header id="appHeader" class="app-header">
                <span id="headerTitle">主客厅</span>
            </header>

            <!-- Tab: 主客厅 -->
            <div id="tab-chat" class="tab-content active">
                <div id="chatList" class="chat-list"></div>
                <div id="chatRoom" class="chat-room">
                    <div class="chat-room-header">
                        <button id="chatBackBtn" class="back-btn">‹</button>
                        <span id="chatRoomName"></span>
                    </div>
                    <div id="chatMessages" class="chat-messages"></div>
                    <div class="chat-input-bar">
                        <input type="text" id="chatInput" placeholder="输入消息...">
                        <button id="chatSendBtn" class="send-btn">发送</button>
                    </div>
                </div>
            </div>

            <!-- Tab: 昏光庭院 -->
            <div id="tab-friends" class="tab-content">
                <div class="search-bar">
                    <input type="text" id="friendSearchInput" placeholder="输入ID搜索用户">
                    <button id="friendSearchBtn" class="search-btn">搜索</button>
                </div>
                <div id="friendSearchResult" class="friend-search-result"></div>
                <div class="section-title">我的好友</div>
                <div id="friendsList" class="friends-list"></div>
                <div class="section-title">好友申请</div>
                <div id="friendRequests" class="friend-requests"></div>
            </div>

            <!-- Tab: 我的 -->
            <div id="tab-account" class="tab-content">
                <div class="account-card">
                    <div class="account-avatar" id="myAvatar">U</div>
                    <div class="account-info">
                        <div class="account-name" id="myName">-</div>
                        <div class="account-id" id="myId">ID: -</div>
                    </div>
                </div>
                <div class="settings-list">
                    <div class="settings-item" id="settingPwd">
                        <span>修改密码</span><span class="arrow">›</span>
                    </div>
                    <div class="settings-item" id="settingTheme">
                        <span>深色模式</span>
                        <label class="switch"><input type="checkbox" id="themeToggle"><span class="slider"></span></label>
                    </div>
                    <div class="settings-item" id="settingLogout">
                        <span class="danger-text">退出登录</span><span class="arrow">›</span>
                    </div>
                </div>
            </div>

            <!-- Bottom Navigation -->
            <nav class="tab-bar">
                <div class="tab-item active" data-tab="chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span>主客厅</span>
                </div>
                <div class="tab-item" data-tab="friends">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span>昏光庭院</span>
                </div>
                <div class="tab-item" data-tab="account">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span>我的</span>
                </div>
            </nav>
        </div>

        <!-- Change Password Modal -->
        <div id="pwdModal" class="modal">
            <div class="modal-card">
                <h3>修改密码</h3>
                <div class="form-group">
                    <input type="password" id="oldPwd" placeholder="当前密码">
                </div>
                <div class="form-group">
                    <input type="password" id="newPwd" placeholder="新密码">
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPwd" placeholder="确认新密码">
                </div>
                <p id="pwdError" class="form-error"></p>
                <div class="modal-actions">
                    <button id="pwdCancel" class="btn-secondary">取消</button>
                    <button id="pwdConfirm" class="btn-primary">确认</button>
                </div>
            </div>
        </div>

        <!-- Message Context Menu -->
        <div id="msgMenu" class="msg-context-menu">
            <div class="menu-item" id="menuEdit">编辑</div>
            <div class="menu-item" id="menuRecall">撤回</div>
            <div class="menu-item" id="menuCopy">复制</div>
        </div>
    </div>

    <script src="js/store.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
